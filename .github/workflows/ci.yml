name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[brotli]" pytest
      - name: Fetch OVMF for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ovmf
          echo "FWLAB_TEST_OVMF=$(ls /usr/share/OVMF/OVMF_CODE*.fd 2>/dev/null | head -1 || echo /usr/share/ovmf/OVMF.fd)" >> "$GITHUB_ENV"
      - name: Run tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          fwlab --version
          fwlab info --summary "$FWLAB_TEST_OVMF" || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check firmwarelab

  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GUI deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 ovmf
          pip install ".[gui]"
      - name: Headless GUI import + render
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from firmwarelab.gui.mainwindow import MainWindow
          import glob
          app = QApplication([])
          w = MainWindow()
          imgs = glob.glob("/usr/share/OVMF/OVMF_CODE*.fd") + glob.glob("/usr/share/ovmf/OVMF.fd")
          if imgs:
              w.load(imgs[0])
          print("GUI OK, items:", w.doc.root.count() if w.doc else 0)
          PY
