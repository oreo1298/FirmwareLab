[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firmwarelab"
version = "0.1.0"
description = "A modern, feature-rich UEFI/BIOS firmware explorer, editor and modding toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-2-Clause" }
authors = [{ name = "FirmwareLab contributors" }]
keywords = ["UEFI", "BIOS", "firmware", "EDK2", "flash", "reverse-engineering", "coreboot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
brotli = ["brotli>=1.0"]
full = ["PySide6>=6.5", "brotli>=1.0"]
dev = ["pytest>=7", "PySide6>=6.5", "brotli>=1.0"]

[project.scripts]
fwlab = "firmwarelab.cli.main:main"

[project.gui-scripts]
firmwarelab = "firmwarelab.gui.app:main"

[project.urls]
Homepage = "https://github.com/oreo1298/firmwarelab"
Repository = "https://github.com/oreo1298/firmwarelab"
Issues = "https://github.com/oreo1298/firmwarelab/issues"

[tool.setuptools.packages.find]
include = ["firmwarelab*"]

[tool.setuptools.package-data]
firmwarelab = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 long lines, E741 ambiguous names, E702 compact argparse setup in cli/main.py
ignore = ["E501", "E741", "E702"]
